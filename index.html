<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f0e8"><title>Palabra · 西语单词手帐</title>
<style>
:root{--ink:#273e37;--muted:#72847b;--cream:#f7f4ed;--green:#36765a;--line:#e3e5dc;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,'PingFang SC',sans-serif}main{max-width:850px;margin:auto;padding:24px 16px 80px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font:700 30px Georgia,serif}.tag{color:var(--muted);font-size:13px}h1{font-size:clamp(24px,6vw,38px);margin:30px 0 8px}.intro{color:var(--muted);margin-bottom:22px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat,.panel{background:white;border:1px solid var(--line);border-radius:20px;padding:20px}.stat strong{display:block;font-size:26px}.stat small{color:var(--muted)}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button,select,input{font:inherit}button{cursor:pointer;border-radius:12px;border:1px solid var(--line);padding:12px 16px;background:white;color:var(--ink)}button.active,.primary{background:var(--green);color:white;border-color:var(--green)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #9fcdb4;outline-offset:2px}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}select,input{border:1px solid var(--line);background:white;border-radius:12px;padding:12px;max-width:100%}.card{background:#e4ece5;border:1px solid #d3dfd4;border-radius:24px;min-height:255px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:18px 0;padding:24px}.word{font-size:clamp(36px,8vw,56px);font-family:Georgia,serif;font-weight:700;overflow-wrap:anywhere}.phonetic{font-size:16px;color:#607a68;margin:7px}.translation{font-size:23px;font-weight:650;margin:10px}.example{font-size:15px;max-width:520px;color:#526a5e}.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.actions button{flex:1;min-width:120px}.hint{font-size:13px;color:var(--muted);text-align:center;margin:14px 0}.hidden{display:none!important}.answer{display:block;width:100%;padding:15px;margin:15px 0;border:1px solid var(--line);border-radius:14px;background:#f9faf7;text-align:left}.answer.correct{border-color:#38956b;background:#eaf6ee}.answer.wrong{border-color:#cb6b59;background:#fff1ed}.listItem{padding:14px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}.listItem:last-child{border-bottom:0}.formrow{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.formrow input{flex:1;min-width:135px}.footer{font-size:12px;color:var(--muted);margin-top:25px;text-align:center}#message{min-height:1.5em;color:var(--green)}@media(max-width:480px){.stats{gap:6px}.stat{padding:12px}.stat strong{font-size:22px}.panel{padding:15px}}
</style>
</head><body><main><div class="top"><div class="brand">Palabra<span style="color:#a76d50">.</span></div><div class="tag">每天一点点 · Español A1</div></div><h1>你的西语单词手帐</h1><p class="intro">记住词汇，也记住每一次小小的进步。</p><div class="stats"><div class="stat"><strong id="total">0</strong><small>词库总量</small></div><div class="stat"><strong id="known">0</strong><small>已掌握</small></div><div class="stat"><strong id="today">0</strong><small>今日练习</small></div></div><nav aria-label="功能切换"><button class="active" data-tab="learn">单词卡片</button><button data-tab="quiz">小测验</button><button data-tab="library">我的词库</button></nav>
<section id="learn" class="panel"><div class="toolbar"><strong>今日学习</strong><select id="category" aria-label="词汇分类"><option value="all">全部词汇</option><option value="greeting">日常问候</option><option value="school">校园生活</option><option value="life">生活与时间</option></select></div><div class="card" aria-live="polite"><div class="word" id="es"></div><div class="phonetic" id="type"></div><div id="meaningBox" class="hidden"><div class="translation" id="zh"></div><div class="example" id="example"></div></div></div><div class="actions"><button id="speak">🔊 西语发音</button><button id="reveal" class="primary">显示中文</button></div><div class="actions" style="margin-top:9px"><button id="again">再记一次</button><button id="master">✓ 已掌握</button><button id="next">下一词 →</button></div><p class="hint">自动记录学习进度，仅保存在当前浏览器中。</p></section>
<section id="quiz" class="panel hidden"><div class="toolbar"><strong>四选一 · 中文释义</strong><button id="newQuiz">换一题 ↻</button></div><div class="card" style="min-height:150px"><div class="word" id="question"></div></div><div id="options"></div><p id="feedback" aria-live="polite"></p></section>
<section id="library" class="panel hidden"><strong>词库管理</strong><p class="tag">添加你在课本里遇到的新词，也可以删除自己添加的词。</p><form id="addForm"><div class="formrow"><input id="newEs" placeholder="西语：biblioteca" required maxlength="80"><input id="newZh" placeholder="中文：图书馆" required maxlength="80"></div><div class="formrow"><input id="newExample" placeholder="例句（选填）" maxlength="180"><button class="primary" type="submit">添加单词</button></div></form><div class="toolbar"><span class="tag" id="wordCount"></span><button id="export">导出我的词库</button></div><div id="list"></div></section><p id="message" role="status"></p><div class="footer">Palabra · 本地学习版，无需注册账号。发音取决于设备可用的西语语音。</div></main>
<script>
const starter=[
['hola','你好','¡Hola! ¿Cómo estás?','greeting','感叹词'],['gracias','谢谢','Muchas gracias por tu ayuda.','greeting','感叹词'],['adiós','再见','Adiós, hasta mañana.','greeting','感叹词'],['por favor','请','Una mesa, por favor.','greeting','短语'],['buenos días','早上好','Buenos días, profesora.','greeting','短语'],['perdón','对不起；打扰一下','Perdón, ¿dónde está el baño?','greeting','感叹词'],['¿qué tal?','怎么样？','Hola, ¿qué tal?','greeting','短语'],['mucho gusto','很高兴认识你','Mucho gusto, Ana.','greeting','短语'],
['libro','书','Este libro es interesante.','school','阳性名词'],['clase','课；班级','La clase empieza a las nueve.','school','阴性名词'],['profesor','男教师','El profesor habla español.','school','阳性名词'],['profesora','女教师','La profesora explica la lección.','school','阴性名词'],['estudiante','学生','Soy estudiante de español.','school','名词'],['universidad','大学','Estudio en la universidad.','school','阴性名词'],['biblioteca','图书馆','La biblioteca está abierta.','school','阴性名词'],['aprender','学习','Quiero aprender español.','school','动词'],['escribir','写','Me gusta escribir en español.','school','动词'],['leer','读','Leo un libro cada semana.','school','动词'],
['agua','水','Quiero beber agua.','life','阴性名词'],['comida','食物','La comida está rica.','life','阴性名词'],['casa','家；房子','Mi casa es pequeña.','life','阴性名词'],['amigo','男性朋友','Mi amigo vive aquí.','life','阳性名词'],['amiga','女性朋友','Mi amiga se llama Lucía.','life','阴性名词'],['hoy','今天','Hoy tengo clase.','life','副词'],['mañana','明天；早晨','Mañana tengo un examen.','life','名词／副词'],['tiempo','时间；天气','No tengo mucho tiempo.','life','阳性名词'],['trabajar','工作','Trabajo por la tarde.','life','动词'],['escuchar','听','Me gusta escuchar música.','life','动词'],['viajar','旅行','Quiero viajar a España.','life','动词'],['feliz','快乐的','Estoy muy feliz hoy.','life','形容词']
].map((a,i)=>({id:'s'+i,es:a[0],zh:a[1],example:a[2],cat:a[3],type:a[4]}));
const get=(key,fallback)=>{try{const v=JSON.parse(localStorage.getItem(key));return v??fallback}catch{return fallback}};
let custom=get('palabra-custom',[]),known=new Set(get('palabra-known',[])),daily=get('palabra-daily',{}),queue=[],pos=0,revealed=false,quiz=null,answered=false;const $=id=>document.getElementById(id);const words=()=>starter.concat(custom);const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{msg('浏览器未允许保存数据，进度可能丢失。')}};const msg=s=>{$('message').textContent=s};
function stats(){const all=words();$('total').textContent=all.length;$('known').textContent=all.filter(w=>known.has(w.id)).length;const day=new Date().toLocaleDateString('en-CA');$('today').textContent=daily[day]||0}
function practice(){const day=new Date().toLocaleDateString('en-CA');daily[day]=(daily[day]||0)+1;save('palabra-daily',daily);stats()}
function initQueue(){const cat=$('category').value;queue=words().filter(w=>cat==='all'||w.cat===cat);pos=0;showCard()}
function showCard(){if(!queue.length){$('es').textContent='暂无单词';$('type').textContent='';$('meaningBox').classList.add('hidden');return}const w=queue[pos%queue.length];$('es').textContent=w.es;$('type').textContent=w.type;$('zh').textContent=w.zh;$('example').textContent=w.example||'';revealed=false;$('meaningBox').classList.add('hidden');$('reveal').textContent='显示中文'}
function next(){if(queue.length){pos=(pos+1)%queue.length;showCard()}}
function speak(){if(!('speechSynthesis' in window)){msg('此设备不支持浏览器语音合成。');return}const w=queue[pos%queue.length];if(!w)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w.es);u.lang='es-ES';u.rate=.85;window.speechSynthesis.speak(u)}
function shuffle(a){return a.slice().sort(()=>Math.random()-.5)}
function makeQuiz(){const all=words();if(all.length<4){$('question').textContent='至少需要 4 个单词';return}quiz=all[Math.floor(Math.random()*all.length)];answered=false;$('question').textContent=quiz.es;$('feedback').textContent='';$('options').replaceChildren();const wrong=shuffle(all.filter(w=>w.zh!==quiz.zh)).slice(0,3);shuffle([quiz,...wrong]).forEach(w=>{const b=document.createElement('button');b.className='answer';b.textContent=w.zh;b.addEventListener('click',()=>{if(answered)return;answered=true;practice();$('options').querySelectorAll('button').forEach(x=>{x.disabled=true;if(x.textContent===quiz.zh)x.classList.add('correct')});if(w.id===quiz.id){$('feedback').textContent='正确！¡Muy bien!'}else{b.classList.add('wrong');$('feedback').textContent='再记一下：'+quiz.es+' = '+quiz.zh}});$('options').appendChild(b)})}
function drawList(){const el=$('list');el.replaceChildren();$('wordCount').textContent=words().length+' 个词';words().forEach(w=>{const d=document.createElement('div');d.className='listItem';const t=document.createElement('span');t.textContent=w.es+' · '+w.zh;d.appendChild(t);if(w.id.startsWith('c')){const b=document.createElement('button');b.textContent='删除';b.setAttribute('aria-label','删除 '+w.es);b.addEventListener('click',()=>{custom=custom.filter(x=>x.id!==w.id);known.delete(w.id);save('palabra-custom',custom);save('palabra-known',[...known]);initQueue();drawList();stats()});d.appendChild(b)}el.appendChild(d)})}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));['learn','quiz','library'].forEach(id=>$(id).classList.toggle('hidden',id!==b.dataset.tab));if(b.dataset.tab==='quiz')makeQuiz();if(b.dataset.tab==='library')drawList()}));
$('category').addEventListener('change',initQueue);$('reveal').addEventListener('click',()=>{if(!queue.length)return;revealed=!revealed;$('meaningBox').classList.toggle('hidden',!revealed);$('reveal').textContent=revealed?'隐藏中文':'显示中文';if(revealed)practice()});$('speak').addEventListener('click',speak);$('again').addEventListener('click',()=>{practice();next()});$('master').addEventListener('click',()=>{if(!queue.length)return;known.add(queue[pos%queue.length].id);save('palabra-known',[...known]);practice();stats();next()});$('next').addEventListener('click',next);$('newQuiz').addEventListener('click',makeQuiz);
$('addForm').addEventListener('submit',e=>{e.preventDefault();const es=$('newEs').value.trim(),zh=$('newZh').value.trim(),example=$('newExample').value.trim();if(!es||!zh)return;if(words().some(w=>w.es.toLowerCase()===es.toLowerCase())){msg('这个单词已经在词库里啦。');return}custom.push({id:'c'+Date.now()+'-'+Math.random().toString(36).slice(2),es,zh,example,cat:'custom',type:'自定义'});save('palabra-custom',custom);$('addForm').reset();drawList();initQueue();stats();msg('单词已添加！')});
$('export').addEventListener('click',()=>{const header=['Spanish','Chinese','Example','Category'];const rows=words().map(w=>[w.es,w.zh,w.example,w.cat]);const csv=[header,...rows].map(row=>row.map(s=>'"'+String(s??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='palabra-vocabulary.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});initQueue();stats();
</script></body></html>
